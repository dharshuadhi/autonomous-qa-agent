name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  issues: write

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      HEADLESS: "true"
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      ADO_ORG: ${{ secrets.ADO_ORG }}
      ADO_PROJECT: ${{ secrets.ADO_PROJECT }}
      ADO_PAT: ${{ secrets.ADO_PAT }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Run tests
        run: mvn -B test

      # TEMPORARY diagnostic: CI logs aren't readable without sign-in,
      # so on failure publish the surefire reports to a (public) issue.
      - name: Publish failure diagnostics
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "## Surefire reports for run ${{ github.run_id }}"
            echo
            for f in target/surefire-reports/*.txt; do
              echo "### $f"
              echo '```'
              head -c 8000 "$f"
              echo '```'
            done
            echo
            echo "### target/checkout-debug.txt"
            echo '```'
            cat target/checkout-debug.txt 2>/dev/null || echo "(no checkout debug file)"
            echo '```'
          } > /tmp/diag.md
          gh issue create --title "[CI DEBUG] diagnostics for run ${{ github.run_id }}" --body-file /tmp/diag.md

      - name: Generate Allure report
        if: always()
        run: |
          npm install -g allure-commandline --silent
          allure generate target/allure-results --clean -o allure-report

      - name: Upload Allure report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
